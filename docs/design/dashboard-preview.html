<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Trading Analyst · Dashboard preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --fg: #000000;
    --muted: #5E5E5E;
    --line: #E2E2E2;
    --soft: #F3F3F3;
    --blue: #1640D6;
    --blue-soft: #E7EDFD;
    --loss: #8C8C8C;
    --focus: #1640D6;
    --radius-s: 6px;
    --radius-m: 12px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #000000;
      --fg: #FFFFFF;
      --muted: #A6A6A6;
      --line: #262626;
      --soft: #121212;
      --blue: #5B8CFF;
      --blue-soft: #0D1A3A;
      --loss: #6E6E6E;
      --focus: #5B8CFF;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --fg: #FFFFFF;
    --muted: #A6A6A6;
    --line: #262626;
    --soft: #121212;
    --blue: #5B8CFF;
    --blue-soft: #0D1A3A;
    --loss: #6E6E6E;
    --focus: #5B8CFF;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
  }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* Shell */
  .shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
  .side { display: none; }
  @media (min-width: 960px) {
    .shell { grid-template-columns: 220px 1fr; }
    .side {
      display: flex; flex-direction: column; gap: 2px;
      border-right: 1px solid var(--line);
      padding: 20px 12px; position: sticky; top: 0; height: 100vh;
    }
  }
  .brand { font-weight: 700; font-size: 17px; padding: 4px 10px 18px; letter-spacing: -0.01em; }
  .brand span { color: var(--blue); }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: var(--radius-s);
    color: var(--muted); text-decoration: none; cursor: pointer;
    background: none; border: 0; text-align: left; width: 100%;
  }
  .nav-item svg { width: 18px; height: 18px; flex: none; }
  .nav-item[aria-current="page"] { color: var(--fg); background: var(--soft); font-weight: 600; }
  .nav-item[aria-current="page"] svg { color: var(--blue); }
  .nav-item:hover { color: var(--fg); }

  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 12px 16px;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--bg);
  }
  .topbar .brand-m { font-weight: 700; margin-right: auto; }
  .topbar .brand-m span { color: var(--blue); }
  @media (min-width: 960px) { .topbar .brand-m { display: none; } .topbar .acct { margin-right: auto; } }
  .acct select {
    border: 1px solid var(--line); background: var(--bg);
    border-radius: var(--radius-s); padding: 7px 30px 7px 10px; max-width: 230px;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  .pill-btn {
    border: 1px solid var(--line); background: var(--bg);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  .pill-btn[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); }

  main { padding: 16px 16px 96px; max-width: 1180px; width: 100%; }
  @media (min-width: 960px) { main { padding: 24px 32px 48px; } }

  .notice {
    font-size: 13px; color: var(--muted);
    border-left: 3px solid var(--blue); padding: 6px 10px; margin-bottom: 18px;
    background: var(--blue-soft);
    border-radius: 0 var(--radius-s) var(--radius-s) 0;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; font-size: 13px; color: var(--muted);
  }

  /* Hero: equity curve */
  .hero { margin-bottom: 28px; }
  .hero h1 { font-size: 15px; font-weight: 500; color: var(--muted); margin: 0 0 4px; }
  .hero .big {
    font-size: clamp(34px, 8vw, 52px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .hero .big .sub { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .chart-wrap { margin-top: 14px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .axis-label { fill: var(--muted); font-size: 11px; }

  /* Sections */
  section.block { border-top: 1px solid var(--line); padding: 22px 0 26px; }
  section.block > h2 { font-size: 17px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.005em; }
  section.block > .hint { color: var(--muted); font-size: 13px; margin: 0 0 16px; max-width: 70ch; }

  /* KPI grid: ruled, not carded */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 720px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
  .kpi { padding: 14px 14px 16px 0; border-bottom: 1px solid var(--line); }
  .kpi:nth-child(odd) { padding-right: 14px; }
  @media (min-width: 720px) { .kpi { padding-right: 18px; } }
  .kpi .label { font-size: 13px; color: var(--muted); }
  .kpi .value { font-size: 24px; font-weight: 600; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .kpi .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .pos { color: var(--blue); }
  .neg { color: var(--fg); }
  .arrow { width: 14px; height: 14px; flex: none; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .badge.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .badge.ok { color: var(--blue); }
  .badge.warn { color: var(--fg); border-style: dashed; }
  .badge.muted { color: var(--muted); }

  /* Funded */
  .rules { display: grid; gap: 18px; }
  @media (min-width: 720px) { .rules { grid-template-columns: 1fr 1fr; gap: 22px 32px; } }
  .rule-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rule-head .name { font-weight: 600; }
  .rule-head .how { font-size: 12px; color: var(--muted); }
  .meter { height: 10px; background: var(--soft); border-radius: 999px; margin: 8px 0 6px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--blue); border-radius: 999px; }
  .meter.used > div {
    background: repeating-linear-gradient(135deg, var(--loss) 0 4px, transparent 4px 7px);
    border: 1px solid var(--loss);
  }
  .rule-foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 8px; }
  .rule-foot strong { color: var(--fg); font-weight: 600; }
  .honest {
    margin-top: 18px; font-size: 13px; color: var(--muted);
    border: 1px dashed var(--line); border-radius: var(--radius-s); padding: 10px 12px;
  }

  /* Two-column area */
  .split { display: grid; gap: 0; }
  @media (min-width: 960px) { .split { grid-template-columns: 1.4fr 1fr; gap: 0 40px; } }

  /* Calendar */
  .cal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .cal .dow { font-size: 11px; color: var(--muted); padding-bottom: 2px; }
  .cell {
    border-radius: var(--radius-s); padding: 6px; min-height: 52px;
    border: 1px solid var(--line); font-size: 11px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .cell .d { color: var(--muted); }
  .cell .amt { font-weight: 600; font-size: 12px; }
  .cell.win { border-color: transparent; }
  .cell.win .d { color: inherit; opacity: .8; }
  .cell.loss {
    background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--loss) 35%, transparent) 0 3px, transparent 3px 7px);
  }

  /* Adherence */
  .adh { display: grid; grid-template-columns: 1fr 1fr; }
  .adh > div { padding: 4px 16px 4px 0; }
  .adh > div + div { border-left: 1px solid var(--line); padding-left: 16px; }
  .adh .num { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; }
  .adh .lbl { font-size: 13px; color: var(--muted); }
  .adh-note { margin-top: 14px; font-size: 14px; max-width: 62ch; }

  /* Sessions */
  .sess-row { display: grid; grid-template-columns: 90px 1fr 92px; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .sess-row:last-child { border-bottom: 0; }
  .sess-row .n { font-size: 12px; color: var(--muted); }
  .bar-track { position: relative; height: 12px; }
  .bar-track .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
  .bar-track .bar { position: absolute; top: 0; height: 12px; border-radius: 3px; }
  .bar.p { background: var(--blue); }
  .bar.n { background: repeating-linear-gradient(135deg, var(--loss) 0 3px, transparent 3px 6px); border: 1px solid var(--loss); }
  .sess-row .r { text-align: right; font-weight: 600; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }

  /* Trades table */
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; }
  .tag { font-size: 12px; color: var(--muted); }

  footer.disc { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px; max-width: 75ch; }

  /* Mobile bottom nav */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--bg); border-top: 1px solid var(--line);
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .bottom .nav-item { flex-direction: column; gap: 3px; font-size: 11px; padding: 6px 2px; align-items: center; text-align: center; }
  .bottom .nav-item[aria-current="page"] { background: none; }
  @media (min-width: 960px) { .bottom { display: none; } }

  @media (prefers-reduced-motion: no-preference) {
    .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  }
</style>
</head>

let lang = "en";
const t = (k, vars) => {
  let s = (DICT[lang][k] ?? DICT.en[k] ?? k);
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.replaceAll("{" + a + "}", b);
  return s;
};

/* ---------- Sample data (seeded, so numbers stay consistent) ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const r2 = x => Math.round(x * 100) / 100;

function tradingDays() {
  const out = []; const d = new Date(Date.UTC(2026, 8, 21));
  while (out.length < 20) { const w = d.getUTCDay(); if (w >= 1 && w <= 5) out.push(new Date(d)); d.setUTCDate(d.getUTCDate() + 1); }
  return out;
}
const DAYS = tradingDays();

function generate(seed, risk, start) {
  const rnd = mulberry32(seed);
  const symbols = ["EURUSD", "GBPUSD", "XAUUSD", "US30"];
  const strategies = ["London Breakout", "Pullback to MA", null];
  const sessions = ["asian", "london", "ny"];
  const trades = [];
  DAYS.forEach(day => {
    const n = Math.floor(rnd() * 4.2);
    for (let i = 0; i < n; i++) {
      const sr = rnd();
      const session = sr < 0.2 ? "asian" : sr < 0.65 ? "london" : "ny";
      const strategy = strategies[Math.floor(rnd() * 2.6)] ?? null;
      const followed = strategy !== null && rnd() < 0.68;
      let R;
      const q = rnd();
      if (followed) R = q < 0.56 ? 1.1 + rnd() * 1.2 : (q < 0.6 ? 0 : -(0.85 + rnd() * 0.2));
      else R = q < 0.4 ? 0.4 + rnd() * 1.0 : (q < 0.45 ? 0 : -(0.95 + rnd() * 0.6));
      if (session === "asian" && !followed) R -= 0.15;
      const gross = r2(R * risk);
      const cost = r2(1.5 + rnd() * 4);
      const net = r2(gross - cost);
      trades.push({
        date: day, symbol: symbols[Math.floor(rnd() * symbols.length)],
        side: rnd() < 0.5 ? "buy" : "sell", session, strategy, followed,
        gross, cost, net, R: r2(net / risk)
      });
    }
  });
  return { trades, risk, start };
}

const ACCOUNTS = {
  paper: generate(7, 50, 5000),
  funded: generate(21, 80, 10000)
};

function compute(acc) {
  const T = acc.trades;
  const n = T.length;
  const BE_TOL = 1; // |net| < $1 counts as breakeven
  const wins = T.filter(x => x.net >= BE_TOL), losses = T.filter(x => x.net <= -BE_TOL);
  const be = n - wins.length - losses.length;
  const net = r2(T.reduce((a, x) => a + x.net, 0));
  const grossProfit = r2(wins.reduce((a, x) => a + x.net, 0));
  const grossLoss = r2(-losses.reduce((a, x) => a + x.net, 0));
  const costs = r2(T.reduce((a, x) => a + x.cost, 0));
  const grossProfitBeforeCosts = r2(T.filter(x => x.gross > 0).reduce((a, x) => a + x.gross, 0));
  const expR = n ? T.reduce((a, x) => a + x.R, 0) / n : 0;
  const expUsd = n ? net / n : 0;
  const pf = grossLoss > 0 ? grossProfit / grossLoss : null;

  let bal = acc.start, peak = acc.start, maxDD = 0, maxDDpct = 0;
  const equity = [acc.start], under = [0];
  T.forEach(x => {
    bal = r2(bal + x.net); peak = Math.max(peak, bal);
    const dd = peak - bal; if (dd > maxDD) { maxDD = dd; maxDDpct = dd / peak; }
    equity.push(bal); under.push(dd);
  });

  const byDay = DAYS.map(d => {
    const list = T.filter(x => x.date.getTime() === d.getTime());
    return { date: d, net: r2(list.reduce((a, x) => a + x.net, 0)), count: list.length };
  });
  const activeDays = byDay.filter(d => d.count > 0);

  const sess = ["asian", "london", "ny"].map(s => {
    const list = T.filter(x => x.session === s);
    return { s, n: list.length, avgR: list.length ? list.reduce((a, x) => a + x.R, 0) / list.length : 0 };
  });

  const fol = T.filter(x => x.followed), brk = T.filter(x => !x.followed && x.strategy !== null);
  const avg = L => L.length ? L.reduce((a, x) => a + x.R, 0) / L.length : 0;
  const netWithoutBroken = r2(T.filter(x => x.followed || x.strategy === null).reduce((a, x) => a + x.net, 0));

  return { n, wins: wins.length, losses: losses.length, be, net, grossProfit, grossLoss, costs, grossProfitBeforeCosts,
    expR, expUsd, pf, maxDD: r2(maxDD), maxDDpct, equity, under, bal, byDay, activeDays, sess,
    fol: { n: fol.length, avg: avg(fol) }, brk: { n: brk.length, avg: avg(brk) }, netWithoutBroken };
}

const MINUS = "−";
function money(x, sign = true) {
  const abs = Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (!sign) return "$" + abs;
  return (x > 0 ? "+" : x < 0 ? MINUS : "") + "$" + abs;
}
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
const rfmt = x => (x > 0 ? "+" : x < 0 ? MINUS : "") + Math.abs(x).toFixed(2) + "R";
const arrow = x => x > 0
  ? '<svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3l5 6H9.5v4h-3V9H3z" fill="currentColor"/></svg>'
  : x < 0 ? '<svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13L3 7h3.5V3h3v4H13z" fill="currentColor"/></svg>' : "";
const cls = x => x > 0 ? "pos" : x < 0 ? "neg" : "";
function confBadge(n) {
  const k = n < 30 ? "conf_low" : n < 100 ? "conf_mod" : "conf_high";
  return `<span class="badge ${n < 30 ? "warn" : "muted"}">${t(k)}</span>`;
}
const fmtDate = d => d.toLocaleDateString(lang === "en" ? "en-US" : "en-GB", { month: "short", day: "numeric", timeZone: "UTC" });

/* ---------- Charts ---------- */
function equityChart(m) {
  const W = 640, H = 250, top = 10, eqH = 160, gap = 18, uwH = 50;
  const N = m.equity.length - 1;
  const min = Math.min(...m.equity), max = Math.max(...m.equity);
  const pad = (max - min) * 0.12 || 1;
  const y = v => top + (1 - (v - (min - pad)) / ((max + pad) - (min - pad))) * eqH;
  const x = i => 8 + (i / N) * (W - 110);
  const pts = m.equity.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const len = m.equity.reduce((a, v, i) => i ? a + Math.hypot(x(i) - x(i - 1), y(v) - y(m.equity[i - 1])) : 0, 0);
  const startY = y(m.equity[0]);
  const uwTop = top + eqH + gap;
  const maxU = Math.max(...m.under, 1);
  const uy = v => uwTop + (v / maxU) * uwH;
  const uwPath = `M${x(0)},${uwTop} ` + m.under.map((v, i) => `L${x(i).toFixed(1)},${uy(v).toFixed(1)}`).join(" ") + ` L${x(N)},${uwTop} Z`;
  const ex = x(N), ey = y(m.equity[N]);
  return `
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("eq_label")}">
    <defs>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="var(--loss)" stroke-width="2"/>
      </pattern>
    </defs>
    <line x1="8" x2="${W - 102}" y1="${startY}" y2="${startY}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text class="axis-label" x="8" y="${startY - 5}">${money(m.equity[0], false)}</text>
    <polyline class="draw" style="--len:${len.toFixed(0)}" points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${ex}" cy="${ey}" r="4.5" fill="var(--blue)"/>
    <text x="${ex + 10}" y="${ey + 4}" font-size="14" font-weight="600" fill="var(--fg)">${money(m.bal, false)}</text>
    <text class="axis-label" x="8" y="${uwTop - 5}">${t("dd_label")}</text>
    <line x1="8" x2="${W - 102}" y1="${uwTop}" y2="${uwTop}" stroke="var(--line)"/>
    <path d="${uwPath}" fill="url(#hatch)" stroke="var(--loss)" stroke-width="1"/>
    <text class="axis-label" x="${ex + 10}" y="${uy(maxU) }">${MINUS}${money(m.maxDD, false)}</text>
  </svg>`;
}

function dailyChart(m) {
  const W = 640, H = 170, mid = 85, h = 70;
  const maxAbs = Math.max(...m.byDay.map(d => Math.abs(d.net)), 1);
  const bw = (W - 20) / m.byDay.length;
  const bars = m.byDay.map((d, i) => {
    const bh = Math.abs(d.net) / maxAbs * h;
    const xx = 10 + i * bw + bw * 0.18, w = bw * 0.64;
    if (d.count === 0) return `<rect x="${xx}" y="${mid - 1}" width="${w}" height="2" fill="var(--line)"/>`;
    return d.net >= 0
      ? `<rect x="${xx}" y="${mid - bh}" width="${w}" height="${Math.max(bh, 1)}" rx="2" fill="var(--blue)"><title>${fmtDate(d.date)} ${money(d.net)}</title></rect>`
      : `<rect x="${xx}" y="${mid}" width="${w}" height="${Math.max(bh, 1)}" rx="2" fill="url(#hatch2)" stroke="var(--loss)"><title>${fmtDate(d.date)} ${money(d.net)}</title></rect>`;
  }).join("");
  const labels = m.byDay.map((d, i) => i % 5 === 0
    ? `<text class="axis-label" x="${10 + i * bw + bw / 2}" y="${H - 2}" text-anchor="middle">${fmtDate(d.date)}</text>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("daily_title")}">
    <defs><pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--loss)" stroke-width="2"/></pattern></defs>
    <line x1="10" x2="${W - 10}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>
    ${bars}${labels}</svg>`;
}

function calendar(m) {
  const maxWin = Math.max(...m.byDay.map(d => d.net), 1);
  const head = t("dow").map(d => `<div class="dow">${d}</div>`).join("");
  const cells = m.byDay.map(d => {
    if (d.count === 0) return `<div class="cell"><span class="d">${d.date.getUTCDate()}</span><span class="amt" style="color:var(--muted)">–</span></div>`;
    if (d.net >= 0) {
      const a = 0.25 + 0.75 * (d.net / maxWin);
      const strong = a > 0.55;
      return `<div class="cell win" style="background:color-mix(in srgb, var(--blue) ${Math.round(a * 100)}%, var(--bg));${strong ? "color:#fff" : ""}">
        <span class="d">${d.date.getUTCDate()}</span><span class="amt">${money(d.net)}</span></div>`;
    }
    return `<div class="cell loss"><span class="d">${d.date.getUTCDate()}</span><span class="amt">${money(d.net)}</span></div>`;
  }).join("");
  return `<div class="cal">${head}${cells}</div>`;
}

/* ---------- Funded rules ---------- */
function fundedBlock(acc, m) {
  const start = acc.start;
  const dailyLimit = start * 0.05, maxLimit = start * 0.10, target = start * 0.08;
  const lastDay = m.byDay[m.byDay.length - 1];
  const todayNet = lastDay.net;
  const dailyLeft = dailyLimit + Math.min(0, todayNet) + Math.max(0, todayNet);
  const dailyUsed = Math.max(0, -todayNet);
  const maxLeft = m.bal - (start - maxLimit);
  const profit = m.bal - start;
  const profitDays = m.activeDays.filter(d => d.net > 0);
  const best = Math.max(0, ...m.byDay.map(d => d.net));
  const totalProfit = Math.max(profit, 0);
  const consRatio = totalProfit > 0 ? best / totalProfit : 0;
  const consNeed = totalProfit > 0 && consRatio > 0.4 ? best / 0.4 - totalProfit : 0;
  const daysDone = m.activeDays.length;

  const status = (left, limit) => left <= 0 ? ["solid", "st_viol"] : left < limit * 0.3 ? ["warn", "st_warn"] : ["ok", "st_ok"];
  const b = ([c, k]) => `<span class="badge ${c}">${t(k)}</span>`;

  const rule = (name, how, badge, meterPct, used, foot1, foot2) => `
    <div>
      <div class="rule-head"><div><div class="name">${name}</div><div class="how">${how}</div></div>${badge}</div>
      <div class="meter ${used ? "used" : ""}"><div style="width:${Math.max(0, Math.min(100, meterPct)).toFixed(1)}%"></div></div>
      <div class="rule-foot"><span>${foot1}</span><span>${foot2}</span></div>
    </div>`;

  return `
  <section class="block" aria-labelledby="fundedH">
    <h2 id="fundedH">${t("funded_title")}</h2>
    <p class="hint">${t("funded_hint")}</p>
    <div class="rules">
      ${rule(t("f_daily"), t("f_daily_how"), b(status(dailyLimit - dailyUsed, dailyLimit)),
        dailyUsed / dailyLimit * 100, true,
        `<strong>${t("f_left_today", { x: money(dailyLimit - dailyUsed, false) })}</strong>`, t("f_of", { x: money(dailyLimit, false) }))}
      ${rule(t("f_max"), t("f_max_how"), b(status(maxLeft, maxLimit)),
        (maxLimit - Math.min(maxLeft, maxLimit)) / maxLimit * 100, true,
        `<strong>${t("f_left", { x: money(Math.max(maxLeft, 0), false) })}</strong>`, t("f_of", { x: money(maxLimit, false) }))}
      ${rule(t("f_target"), t("f_target_how"),
        profit >= target ? b(["ok", "st_done"]) : `<span class="badge muted">${pct(Math.max(profit, 0) / target, 0)}</span>`,
        Math.max(profit, 0) / target * 100, false,
        `<strong>${t("f_progress", { x: money(Math.max(profit, 0), false), y: money(target, false) })}</strong>`, "")}
      ${rule(t("f_cons"), t("f_cons_how"),
        consRatio > 0.4 ? b(["warn", "st_warn"]) : b(["ok", "st_ok"]),
        consRatio * 100 / 0.4 * 0.4, false,
        `<strong>${t("f_cons_ok", { x: pct(consRatio, 0) })}</strong>`,
        consNeed > 0 ? t("f_cons_need", { x: money(consNeed, false) }) : "")}
      ${rule(t("f_days"), t("f_days_how"),
        daysDone >= 4 ? b(["ok", "st_done"]) : b(["warn", "st_warn"]),
        Math.min(daysDone / 4, 1) * 100, false,
        `<strong>${t("f_days_v", { x: daysDone, y: 4 })}</strong>`, "")}
    </div>
    <p class="honest">${t("unverifiable")}</p>
  </section>`;
}

          </tr></thead>
          <tbody>
            ${recent.map(x => `<tr>
              <td>${fmtDate(x.date)}</td><td>${x.symbol}</td><td>${t(x.side)}</td>
              <td>${x.strategy ?? `<span class="tag">${t("none")}</span>`}</td>
              <td>${x.strategy === null ? "–" : x.followed ? `<span class="badge ok">${t("followed")}</span>` : `<span class="badge solid">${t("broken")}</span>`}</td>
              <td class="num ${cls(x.R)}">${rfmt(x.R)}</td>
              <td class="num ${cls(x.net)}">${money(x.net)}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </section>

    <footer class="disc">${t("disc")}</footer>
  `;
}

/* ---------- Controls ---------- */
document.getElementById("acctSel").addEventListener("change", render);
document.getElementById("langBtn").addEventListener("click", e => {
  lang = lang === "en" ? "ru" : "en";
  e.currentTarget.setAttribute("aria-pressed", String(lang === "ru"));
  render();
});
const themeBtn = document.getElementById("themeBtn");
function currentTheme() {
  const set = document.documentElement.getAttribute("data-theme");
  if (set) return set;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function syncThemeBtn() { themeBtn.textContent = currentTheme() === "dark" ? t("theme_light") : t("theme_dark"); }
themeBtn.addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", currentTheme() === "dark" ? "light" : "dark");
  syncThemeBtn();
});
render();
syncThemeBtn();
</script>
</body>
</html>
